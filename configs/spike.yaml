# Spike configuration, rev 4 (zone-conditioned decoder; rev 3 scenario unchanged).
trajectory: {N: 80, Bw: 20, alpha_basis: 50.0, ramp_eps: 0.1, v_nom: 1.0, T_min: 40.0, T_max: 150.0,
             horizon_mode: fixed, T_fixed: 150.0}   # rev 3: one horizon for every candidate
wrench:
  u_max: 2353.0        # FROM_REPO generate_c_code.py ubu
  l: 2.05427           # FROM_REPO wamv.py 'B' thruster separation
  alpha_bar: 1.0       # score-level cap; certificate uses alpha_bar_policy
  rho_u_frac: 0.05
  rho_a: 0.05
  rho_growth_T: 60.0   # seconds for margins to double (time-growing rho_k)
  eps_cert: 25.0       # N^2 on max_k (r_x^2 + r_psi^2), THRUSTER AXES ONLY
  sway_drift_rate: 0.05  # m/s, mean uncorrected sideslip rate (rev 3, horizon-invariant)
  pgd_iters: 300       # score-level FISTA budget (soft signal)
  cert_iters: 1500     # certificate-level budget (near-threshold accuracy)
  R0: 0.001            # FROM_REPO generate_c_code.py W_u
  gamma_R: 0.01        # FROM_REPO fallback (paper R(H)=R0+gamma*diag(1-h))
  kappa: 1.5           # EAMPC confidence policy
  eps_conf: 0.01
score:   {lambda_o: 1.0, lambda_s: 0.1, lambda_f: 10.0, lambda_e: 0.01, lambda_t: 10.0, eps_obs: 3.0} 
data:
  n_samples: 8000
  h1_range: [0.05, 1.0]
  h1_holdout: [0.20, 0.30]
  h2_fixed: 1.0
  sea_state: 3
  direction: nominal
  chunk: 512
  seed: 0
  prop_mid_std_m: 3.0
  prop_mix: [1.0, 1.0, 1.0]          # rev 3: Zone 1 / Zone 2 / Zone 3 modes
  shape_per_mode: true
  share_d2: 100.0                    # feasible-share threshold on d2_max (N^2)
  start_d_range: [100.0, 140.0]      # start arc: distance from the opening (m)
  start_bearing_deg: [-35.0, 35.0]   # bearing from the opening, 0 = due east
  start_heading_jitter_deg: 45.0
model: {latent_dim: 2, w_pg: 10.0, hidden: [256, 256], gamma: 10.0, Cz_max: 5.0, a_shaping: 10.0,
        lr: 1.0e-3, batch: 256, epochs: 700, recon_sigma: 1.0, seed: 0}
online: {K: 100, z_lo: -1.64, z_hi: 1.64, z_mode: bank, z_jitter: 0.15, k_present: 3, beta_max_deg: 25.0}
planner: {N_ocp: 80, ipopt_max_iter: 400, ipopt_retries: 2, slack_tol: 0.5, dock_margin: 3.0, terminal_inset: 2.5, w_slack: 1.0e+4}
exact: {dt_sim: 0.1, kp: 0.2, kd: 0.9, kpsi: 0.4, kr: 1.2, e_max: 5.0, arrive_tol: 1.5, hull_radius: 1.5}
