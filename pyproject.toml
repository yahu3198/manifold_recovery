[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "manifold-recovery"
version = "0.1.0"
description = "Conditional recovery-trajectory manifolds for fault-degraded USVs with certified feasibility (spike build)"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "pyyaml", "pandas", "shapely", "casadi"]

[project.optional-dependencies]
model = ["torch"]
logs = ["rosbags"]

[tool.setuptools.packages.find]
where = ["src"]
